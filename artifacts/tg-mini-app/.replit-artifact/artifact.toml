kind = "web"
previewPath = "/"
title = "Orbit Market"
version = "1.0.0"
id = "artifacts/tg-mini-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22737

[services.development]
run = "pnpm --filter @workspace/tg-mini-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tg-mini-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/tg-mini-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22737"
BASE_PATH = "/"
